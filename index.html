<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cook This</title>
    <meta name="description" content="Tell it what's in your pantry and it finds recipes you can make with it." />
    <meta name="theme-color" content="#eef5f6" />
    <link rel="icon" href="icons/favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <h1 class="title">Cook This</h1>
        <p class="lede">Tell me what's in your kitchen, and I'll find something delicious to make with it.</p>
      </header>

      <form id="pantry-form" class="pantry" autocomplete="off">
        <label for="ingredient" class="sr-only">Add an ingredient you have</label>
        <div class="box" id="box">
          <ul class="chips" id="chips" aria-label="Your ingredients"></ul>
          <input
            id="ingredient"
            type="text"
            role="combobox"
            aria-expanded="false"
            aria-controls="suggestions"
            aria-autocomplete="list"
            placeholder="Add an ingredient — chicken, rice, lemon…"
            enterkeyhint="enter"
          />
          <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
        </div>

        <div class="try" id="try">
          <span class="try-label">Try:</span>
        </div>

        <div class="controls">
          <label class="basics">
            <input type="checkbox" id="basics" checked />
            <span>I have the basics <span class="muted">salt, pepper, oil, butter, flour, sugar, water</span></span>
          </label>
          <button type="submit" class="cook" id="cook">Find recipes</button>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="results" class="results" aria-label="Recipes"></section>
    </main>

    <dialog id="recipe" class="recipe" aria-labelledby="recipe-title"></dialog>

    <footer class="footer">
      Recipes from <a href="https://www.themealdb.com" target="_blank" rel="noopener">TheMealDB</a>. Only ingredient names are sent to TheMealDB.
    </footer>

    <script src="app.js" type="module"></script>
  </body>
</html>
