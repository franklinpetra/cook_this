<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cook This</title>
    <meta name="description" content="Tell it what's in your pantry and it finds recipes you can make with it." />
    <meta name="theme-color" content="#fff6e9" />
    <link rel="icon" href="icons/favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The wriggle: a hand-drawn "line boil". Fresh noise every few frames makes the edges squirm. -->
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <filter id="wriggle" x="-5%" y="-20%" width="110%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1">
          <animate id="boil" attributeName="seed" values="1;2;3;4;5;6" dur="0.9s" calcMode="discrete" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="5" />
      </filter>
      <filter id="wriggle-soft" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3">
          <animate attributeName="seed" values="3;4;5;6" dur="1.6s" calcMode="discrete" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="3" />
      </filter>
    </svg>

    <main class="page">
      <header class="masthead">
        <h1 class="title"><span class="pot" aria-hidden="true">🍲</span> Cook This</h1>
        <p class="lede">Tell me what's in your kitchen. I'll find something delicious to make with it.</p>
      </header>

      <form id="pantry-form" class="pantry" autocomplete="off">
        <label for="ingredient" class="sr-only">Add an ingredient you have</label>
        <div class="wriggle-box" id="box">
          <svg class="wriggle-edge" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="26" ry="26" /></svg>
          <ul class="chips" id="chips" aria-label="Your ingredients"></ul>
          <input
            id="ingredient"
            type="text"
            role="combobox"
            aria-expanded="false"
            aria-controls="suggestions"
            aria-autocomplete="list"
            placeholder="Type something you have… chicken, rice, lemon"
            enterkeyhint="enter"
          />
          <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
        </div>

        <div class="try" id="try">
          <span class="try-label">Try:</span>
        </div>

        <div class="controls">
          <label class="basics">
            <input type="checkbox" id="basics" checked />
            <span>I have the basics <span class="muted">(salt, pepper, oil, butter, flour, sugar, water)</span></span>
          </label>
          <button type="submit" class="cook" id="cook">Cook this!</button>
        </div>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="results" class="results" aria-label="Recipes"></section>
    </main>

    <dialog id="recipe" class="recipe" aria-labelledby="recipe-title"></dialog>

    <footer class="footer">
      Recipes from <a href="https://www.themealdb.com" target="_blank" rel="noopener">TheMealDB</a>. Only the ingredient names you add are sent to it.
    </footer>

    <script src="app.js" type="module"></script>
  </body>
</html>
